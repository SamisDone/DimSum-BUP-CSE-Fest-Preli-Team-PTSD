name: Build, test, and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # The Dockerfile COPYs web/, so a console-only change still changes the
      # image. Without this the published tag silently drifts from main.
      - "web/**"
      - "package.json"
      - "bun.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test

      - run: bun run verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, load into the local daemon, but don't push yet — an image
      # that fails the smoke test below must never reach the registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gridwise-smoke-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run it exactly as a judge would: no baked-in env, external curl against
      # the documented port. Catches a broken COPY, a bad CMD, or a runtime
      # crash that unit tests against source can't see.
      - name: Smoke-test the built image
        run: |
          set -e
          docker run -d --name smoke -p 3000:3000 gridwise-smoke-test:${{ github.sha }}
          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::image never became healthy"
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag and push the exact image that just passed the smoke test — no
      # rebuild, so what's published is byte-for-byte what was verified.
      - name: Push verified image
        run: |
          docker tag gridwise-smoke-test:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-energy-optimizer:latest
          docker tag gridwise-smoke-test:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-energy-optimizer:sha-${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-energy-optimizer:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-energy-optimizer:sha-${{ github.sha }}
