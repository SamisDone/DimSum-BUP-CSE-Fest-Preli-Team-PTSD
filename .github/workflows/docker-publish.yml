name: Build, test, and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # The Dockerfile COPYs web/, so a console-only change still changes the
      # image. Without this the published tag silently drifts from main.
      - "web/**"
      - "package.json"
      - "bun.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test

      - run: bun run verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-energy-optimizer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-energy-optimizer:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
